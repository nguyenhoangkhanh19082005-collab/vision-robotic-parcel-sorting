# Cấu hình trạm phân loại hợp nhất (Vision + băng tải ESP32 + robot 6 trục)
# Đơn vị: mét cho `layout`, milimét cho tọa độ robot trong `sorting`, độ cho góc khớp.
# Hệ tọa độ chung: hệ BASE robot — gốc ở chân đế trên trục J1, Z hướng lên, X hướng ra trước
# (phía cổ tay khi robot ở tư thế 0). Mọi giá trị bố trí dưới đây là ƯỚC LƯỢNG ban đầu:
# phải đo lại tại hiện trường hoặc dùng chức năng "GHI TƯ THẾ" để dạy vị trí thật.

paths:
  machine_vision_root: "../Webcamandconveyor/too/MachineVision"
  machine_vision_config: "config/default.yaml"   # tương đối với machine_vision_root
  robot_root: "../robotarm-6-axis"

robot:
  connection: "usb"          # usb | lan  (mặc định chọn trên tab ROBOT, vẫn đổi được trên GUI)
  serial_port: ""            # trống = để GUI robot tự quét cổng COM
  baudrate: 115200
  # CẢNH BÁO MẠNG: firmware robot dùng 192.168.1.177, băng tải dùng 192.168.2.100 (khác subnet).
  # Nếu cả hai cùng nối Ethernet qua một card mạng, nên đổi IP robot sang 192.168.2.x hoặc dùng USB.
  lan_ip: "192.168.1.177"
  lan_port: 8888
  tool_length_mm: 126.0      # gá giác hút dài 21/11/2026 (dong_hoc_step.TOOL_LENGTH_MM; miệng giác cách mặt bích AX-6 129 mm) — đo lại
  # Tỉ lệ robot in thật / CAD Roboter.STEP (1.0 = đúng CAD: trục vai cao 212 mm, thân J1 Ø≈156 mm,
  # đế Ø≈262 mm). Đo robot thật rồi đặt = số đo thật / số CAD. Áp dụng cho cả twin lẫn IK.
  scale: 1.0                # 21/11/2026: robot in 1:1 từ chính file CAD (vừa động cơ NEMA17 42 mm); 0.80 cũ chỉ ước lượng từ ảnh
  telemetry_timeout_s: 0.5   # quá hạn → twin hiển thị góc lệnh thay vì góc thực

layout:
  conveyor:
    # Vị trí đặt băng tải (m, hệ base robot) — robot CHƯA lắp: đo lại khi lắp đặt.
    center: [0.22, -0.10]    # tâm băng tải (X ngang băng, Y dọc băng; đầu vào ở phía Y âm)
    base_z: -0.043           # mặt bàn thấp hơn đáy robot 43 mm (đế nâng De_nang_J1, 06/11/2026)
    # Mô hình băng tải thật (mm) — ước lượng từ assets/conveyor_photos (ảnh 05 có thước dây).
    # Sau khi sửa, chạy scripts\build_conveyor_model.py để xuất lại STL/GLB.
    model:
      length_total: 400       # đo bằng thước (ảnh 05)
      belt_width: 100         # đo bằng thước (ảnh 05)
      belt_top_height: 82     # ước lượng từ ảnh 01 — nên đo lại
      belt_thickness: 2
      roller_radius: 10
      rail_height: 25
      rail_thickness: 9
      cap_length: 65
      cap_thickness: 11
      cap_height: 24
      leg_positions: [-85, 80]
      leg_width: 15
      leg_thickness: 1.5
      leg_foot_length: 30
  camera:
    y: -0.20                 # vị trí camera dọc băng tải (giá camera chưa in — vị trí dự kiến)
    height_above_belt: 0.40  # khớp installation.camera_to_belt_cm của MachineVision
    show_mount: false        # true khi đã in và lắp giá camera
  pick_y: 0.0                # điểm robot gắp trên băng (gần đầu ra)
  parcel_size: [0.11, 0.15, 0.06]  # X ngang băng, Y dọc băng; nhãn A6 105×148 mm rộng hơn băng 100 mm
  # 3 thùng: 2 vùng giao hàng miền Bắc + 1 thùng lỗi (kiện hỏng / cần xem lại).
  # Vị trí giữ nguyên như bản cũ: ĐẠT → ĐỒNG BẰNG, XEM LẠI → TRUNG DU, LỖI giữ nguyên.
  bins:                      # tâm ĐÁY thùng (m) và kích thước
    DONG_BANG: {label: "THÙNG ĐỒNG BẰNG",   color: "#26a269", center: [0.03, 0.27, -0.043],  size: [0.16, 0.14, 0.08]}
    LOI:       {label: "THÙNG LỖI",         color: "#f85149", center: [0.03, -0.27, -0.043], size: [0.16, 0.14, 0.08]}
    TRUNG_DU:  {label: "THÙNG TRUNG DU-MN", color: "#2f81f7", center: [-0.15, 0.22, -0.043], size: [0.16, 0.14, 0.08]}

sorting:
  joint_speed_deg_s: 9.0       # ≤ tốc độ firmware J2 ≈ 10°/s (hộp số 1:27 × đai 4, 06/11/2026)
  min_move_s: 0.4
  settle_tolerance_deg: 1.5    # sai lệch cho phép giữa góc thực (telemetry) và góc lệnh
  settle_timeout_s: 8.0
  approach_height_mm: 60.0     # độ cao tiếp cận phía trên điểm gắp/thả
  suck_dwell_s: 0.6
  release_dwell_s: 0.5
  conveyor_transfer_s: 2.5     # thời gian chạy băng tải từ camera tới điểm gắp (0 = bỏ qua băng tải)
  conveyor_ack_timeout_s: 2.0
  tick_ms: 40
  home_joints_deg: [0, 0, 0, 0, 0, 0]
  pick_xyz_mm: [220, 0, 97]    # mặt trên kiện: mặt băng 82 + kiện 60 - nén 2 - đế nâng 43
  bins:
    DONG_BANG: {drop_xyz_mm: [30, 270, 127]}
    LOI:       {drop_xyz_mm: [30, -270, 127]}
    TRUNG_DU:  {drop_xyz_mm: [-150, 220, 127]}
  # Kiện PASS: đi theo destination_bin Vision trả về = orders.destination_chute_id (hub trên web).
  # Hub không có trong bảng này → thùng LỖI (không bao giờ đoán vùng giao hàng).
  destination_map:
    "1": DONG_BANG     # HN CENTRAL SOC — Hà Nội
    "3": DONG_BANG     # HP-QN HUB — Hải Phòng, Quảng Ninh
    "5": DONG_BANG     # ND-TH HUB — Nam Định, Thanh Hóa
    "2": TRUNG_DU      # BN-BG HUB — Bắc Ninh, Bắc Giang, Lạng Sơn (tuyến QL1 lên Lạng Sơn)
    "4": TRUNG_DU      # TN-PT HUB — Thái Nguyên, Phú Thọ
    "0": LOI           # ERR-REJECT — tỉnh không hợp lệ
    LOCAL_TEST: DONG_BANG   # chế độ thử cục bộ (không tra database) — chỉ để chạy thử chu trình
  # Kiện không PASS: luôn theo quyết định, bỏ qua destination_bin.
  # REJECT (hỏng/tem lỗi) và MANUAL_REVIEW (cần xem lại) chung thùng LỖI; database vẫn
  # phân biệt hai loại ở sorting_logs.decision (xem v_sorting_exceptions).
  decision_map:
    REJECT: LOI
    MANUAL_REVIEW: LOI
  fallback_bin: LOI
  taught_poses_file: "config/taught_poses.json"
